# PonWrt feeds.conf for ZNXT ZN515XG-D (Airoha AN7581)
# 注意：scripts/feeds 的解析正则是 s/#.+$//，单独的 "#" 空注释行会被判为语法错误，
#       所以本文件每一行注释都必须带内容。
# 前 7 行 = PonWrt 官方 feeds.conf.default 原样保留（master 分支已核实）
# 后 3 行 = 本次新增：PassWall2 主源 / PassWall 依赖包源（PassWall2 仍需要）/ OpenClash
# 注：PassWall v1 已移除，改用 PassWall2（openwrt-passwall2）。

src-git packages https://github.com/immortalwrt/packages.git
src-git luci https://github.com/immortalwrt/luci.git
src-git routing https://github.com/openwrt/routing.git
src-git telephony https://github.com/openwrt/telephony.git
src-git video https://github.com/openwrt/video.git
src-git pon_drivers https://github.com/pbs05/openwrt-pon-drivers.git
src-git pon_userspace https://github.com/pbs05/openwrt-pon-userspace.git

# 新增：PassWall2（官方 feed 方式集成，替代 PassWall v1）
src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git
# PassWall2 的 geoview / v2ray-geoip / v2ray-geosite 仍来自这个依赖包源
src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git

# 新增：OpenClash
src-git openclash https://github.com/vernesong/OpenClash.git

# 新增：Nikki（基于 Mihomo 的透明代理前端）
#   仓库内含 4 个包，feeds install -a 会全部登记：
#     nikki           主包（脚本 + nftables 规则），DEPENDS 里硬依赖 +mihomo
#     mihomo-meta     Mihomo 稳定核心（PROVIDES:=mihomo，DEFAULT_VARIANT=1）
#     mihomo-alpha    Mihomo 预览核心（与 mihomo-meta 互相 CONFLICTS）
#     luci-app-nikki  LuCI 界面（LUCI_DEPENDS:=+luci-base +nikki）
#   其 mihomo-meta/Makefile 依赖 feeds/packages/lang/golang/golang-package.mk，
#   因此本文件必须保留 packages feed。
src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main
