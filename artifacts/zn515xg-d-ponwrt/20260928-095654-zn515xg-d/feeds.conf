# PonWrt feeds.conf for ZNXT ZN515XG-D (Airoha AN7581)
# 注意：scripts/feeds 的解析正则是 s/#.+$//，单独的 "#" 空注释行会被判为语法错误，
#       所以本文件每一行注释都必须带内容。
# 前 7 行 = PonWrt 官方 feeds.conf.default 原样保留（master 分支已核实）
# 后 3 行 = 本次新增：PassWall 主源 / PassWall 依赖包源 / OpenClash

src-git packages https://github.com/immortalwrt/packages.git
src-git luci https://github.com/immortalwrt/luci.git
src-git routing https://github.com/openwrt/routing.git
src-git telephony https://github.com/openwrt/telephony.git
src-git video https://github.com/openwrt/video.git
src-git pon_drivers https://github.com/pbs05/openwrt-pon-drivers.git
src-git pon_userspace https://github.com/pbs05/openwrt-pon-userspace.git

# 新增：PassWall（官方 feed 方式集成）
src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git
src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git

# 新增：OpenClash
src-git openclash https://github.com/vernesong/OpenClash.git
