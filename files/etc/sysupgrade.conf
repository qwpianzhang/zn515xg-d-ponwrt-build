## ZNXT ZN515XG-D / PonWrt —— sysupgrade 额外保留清单
##
## 默认行为：sysupgrade 会保留 opkg 标记为 conffile 的配置（主要是 /etc/config/*）
##           以及 LuCI「备份/升级」页面生成的备份归档。
## 本文件补的是「本固件自定义、且必须跨升级保留」的状态。缺了它，从 LuCI 后台
## 直接升级后会出现：首次启动脚本重跑 → 三个代理被重新禁用、用户改过的卸载
## 开关被写回默认值、MWAN3 配置丢失、SSH 主机密钥被换掉。
##
## 注意：这里只列「状态与配置」，不列 /usr/sbin/offload-switch、
##       /etc/init.d/offload-guard 这类随固件一起更新的程序文件 —— 它们在新
##       rootfs 里本来就是最新版，列进来反而会把旧版覆盖回去。

## 首次启动标记：uci-defaults 靠它判断「这是全新刷机还是升级后的重启」
/etc/zn515xg-d-firstboot

## 代理插件配置（用户节点、订阅、模式、开关都在这里）
/etc/config/passwall2
/etc/config/openclash
/etc/config/nikki

## MWAN3 多 WAN：接口、策略、规则与用户自定义 hook
## /etc/config/mwan3 还是 zz-zn515xg-d-mwan3-defaults 判断「用户是否已配置」
## 的依据（拿它与 /rom 出厂版比对），丢了会被误判成没配过而重新禁用服务。
/etc/config/mwan3
/etc/mwan3.user

## 用户改过的网络/防火墙/运营商参数（最关键，丢了要重新填 LOID / VLAN）
/etc/config/network
/etc/config/firewall
/etc/config/dhcp
/etc/config/pon
/etc/config/iptv
/etc/config/irqbalance

## 自定义工具的运行状态
/etc/config/offload-switch

## SSH 主机密钥与用户自定义定时任务
/etc/dropbear/
/etc/crontabs/
