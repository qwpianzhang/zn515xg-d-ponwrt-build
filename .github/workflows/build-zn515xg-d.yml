name: Build PonWrt for ZNXT ZN515XG-D

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      CORE_PROFILE: lean

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/mono /usr/share/swift /usr/local/julia* /usr/lib/jvm /usr/local/graalvm
          sudo rm -rf /home/linuxbrew /usr/share/az* /opt/az /usr/lib/postgresql
          sudo apt-get clean
          df -h /

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-zn515xg-d
          restore-keys: ccache-zn515xg-d

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: work/ponwrt/dl
          key: dl-ponwrt-an7581
          restore-keys: dl-ponwrt-an7581

      - name: Run build
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Show result
        if: always()
        run: |
          find out -maxdepth 2 -type f | head -50
          echo '--- image sizes ---'
          find out -name '*.itb' -o -name '*.bin' | xargs -r ls -lh

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zn515xg-d-ponwrt
          path: out/*/
          if-no-files-found: error

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: out/*/build*.log
          if-no-files-found: warn
