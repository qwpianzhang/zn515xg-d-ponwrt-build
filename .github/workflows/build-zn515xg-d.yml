name: Build PonWrt (Airoha AN7581)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '机型（必须是 an7581.mk 里 TARGET_DEVICES 之一）'
        required: true
        default: 'znxt_zn515xg-d'
        type: choice
        options:
          - znxt_zn515xg-d
          - fiberhome_hg5585f-ct
          - fiberhome_hg5585f-cu
      core_profile:
        description: 'PassWall2 core 策略'
        required: true
        default: 'full'
        type: choice
        options:
          - none
          - lean
          - full
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    # GitHub 单 job 上限 360 分钟；full 策略要编 xray + sing-box + mihomo 三个
    # Go 核心（含 golang bootstrap），比 lean 慢得多，留足余量。
    timeout-minutes: 355

    env:
      TARGET_DEVICE: ${{ github.event.inputs.target_device || 'znxt_zn515xg-d' }}
      CORE_PROFILE: ${{ github.event.inputs.core_profile || 'full' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/mono /usr/share/swift /usr/local/julia* /usr/lib/jvm /usr/local/graalvm
          sudo rm -rf /home/linuxbrew /usr/share/az* /opt/az /usr/local/share/powershell /usr/lib/postgresql
          sudo rm -rf /usr/local/share/chromium* /opt/microsoft
          sudo apt-get clean
          df -h /
          nproc

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-zn515xg-d-an7581
          restore-keys: ccache-zn515xg-d-an7581

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: work/ponwrt/dl
          key: dl-ponwrt-an7581-v1
          restore-keys: dl-ponwrt-an7581-v1

      - name: Run build
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Show acceptance report
        if: always()
        run: |
          cat out/*/验收报告.txt 2>/dev/null || echo "无验收报告"
          echo '--- 镜像 ---'
          find out -name '*.itb' -o -name '*.bin' | xargs -r ls -lh

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ env.TARGET_DEVICE }}
          path: out/*/
          if-no-files-found: error

      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-summary
          path: out/*/failure-summary.txt
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: out/*/build.log
          if-no-files-found: warn
