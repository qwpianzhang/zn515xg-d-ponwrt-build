name: Build PonWrt (Airoha AN7581)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '机型（必须是 an7581.mk 里 TARGET_DEVICES 之一）'
        required: true
        default: 'znxt_zn515xg-d'
        type: choice
        options:
          - znxt_zn515xg-d
          - fiberhome_hg5585f-ct
          - fiberhome_hg5585f-cu
  push:
    branches:
      - main
    # 只在真正影响固件的文件变动时编译。改 README / 刷机说明不再触发
    # 一次 2.5 小时的完整构建；需要重编时也可用 workflow_dispatch 手动跑。
    paths:
      - 'build.sh'
      - 'feeds.conf'
      - 'zn515xg-d.seed'
      - 'files/**'
      - '.github/workflows/build-zn515xg-d.yml'

# 发布 Release / 上传固件需要写权限（默认 GITHUB_TOKEN 常为只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # GitHub 单 job 上限 360 分钟；本版要编 sing-box + mihomo 两个 Go 核心
    # （含 golang bootstrap），留足余量。
    timeout-minutes: 355

    env:
      TARGET_DEVICE: ${{ github.event.inputs.target_device || 'znxt_zn515xg-d' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/lib/mono /usr/share/swift /usr/local/julia* /usr/lib/jvm /usr/local/graalvm
          sudo rm -rf /home/linuxbrew /usr/share/az* /opt/az /usr/local/share/powershell /usr/lib/postgresql
          sudo rm -rf /usr/local/share/chromium* /opt/microsoft
          sudo apt-get clean
          df -h /
          nproc

      # 静态 key 的缺陷：第一次保存后之后每次都命中、且永远不会再保存，
      # ccache 增量和新增的 dl 包全部丢失。改成「每次运行新 key + 前缀回退」，
      # 配合 cache-keepalive.yml 每天刷新 last_accessed_at，避免 7 天未访问被回收。
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-zn515xg-d-an7581-${{ github.run_id }}
          restore-keys: |
            ccache-zn515xg-d-an7581-

      - name: Cache source tarballs
        uses: actions/cache@v4
        with:
          path: work/ponwrt/dl
          key: dl-ponwrt-an7581-${{ github.run_id }}
          restore-keys: |
            dl-ponwrt-an7581-

      - name: Run build
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Show acceptance report
        if: always()
        run: |
          cat out/*/验收报告.txt 2>/dev/null || echo "无验收报告"
          echo '--- 源码基线 ---'
          cat out/*/ponwrt-commit.txt 2>/dev/null || true
          echo '--- feeds 版本 ---'
          cat out/*/feeds-revisions.txt 2>/dev/null || true
          echo '--- 被 defconfig 剔除的符号 ---'
          cat out/*/dropped-symbols.txt 2>/dev/null || echo "（无）"
          echo '--- 镜像 ---'
          find out -name '*.itb' -o -name '*.bin' | xargs -r ls -lh

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ env.TARGET_DEVICE }}
          path: out/*/
          if-no-files-found: error

      # 固定 tag 的 Release = 稳定的下载地址，以后后台升级可以直接用这个 URL：
      #   https://github.com/<owner>/<repo>/releases/download/znxt_zn515xg-d-latest/<sysupgrade.itb>
      - name: Publish firmware to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TARGET_DEVICE}-latest"
          DIR="$(find out -mindepth 1 -maxdepth 1 -type d | head -1)"
          [ -n "$DIR" ] || { echo "no output dir"; exit 1; }
          SYSUPGRADE="$(basename "$(find "$DIR" -maxdepth 1 -name '*-sysupgrade.itb' | head -1)")"

          {
            echo "## ${TARGET_DEVICE} PonWrt 固件"
            echo
            echo "构建时间：$(date -u '+%Y-%m-%d %H:%M UTC') · 代理方案 HomeProxy + OpenClash + Nikki"
            echo "源码基线见同目录下的 ponwrt-commit.txt 与 feeds-revisions.txt。"
            echo
            echo "### LuCI 后台直接升级"
            echo
            echo "1. 下载 \`${SYSUPGRADE}\`（本 Release 固定 tag \`${TAG}\`，以后重编也是同一个 URL）。"
            echo "2. LuCI → 系统 → 备份/升级 → 刷写新固件，上传该 \`.itb\`，"
            echo "   **保持「保留当前配置」勾选**，不要勾「强制升级」。"
            echo "3. 等待约 3 分钟自动重启。首次刷机请用 \`*-initramfs-recovery.itb\` 和 U-Boot 恢复页。"
            echo
            echo "也可在 SSH 里执行："
            echo '```sh'
            echo "cd /tmp && wget -O sysupgrade.itb \\"
            echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${SYSUPGRADE}"
            echo "sysupgrade -v /tmp/sysupgrade.itb"
            echo '```'
            echo
            echo "### 本版变更：HomeProxy TUN 开箱可用 + 卸载共存 + CPU 调频"
            echo
            echo "上一版在真机切换 HomeProxy 时踩到 4 个启动缺陷，本版把它们全部固化进固件，"
            echo "刷机后不需要再跑任何补丁脚本。"
            echo
            echo "**① 规则集与 DNS 黑洞**：上一版 generate_client.uc 把 3 个 geoip/geosite"
            echo "规则集写成 remote + download_detour: main-out，启动时必须走尚未连上的代理"
            echo "去下载，形成死循环；而 dnsmasq 已被指向 5333，导致全网 DNS 失效。本版把"
            echo "SRS 二进制规则集直接打包进 rootfs，改为 type: local + 本地 path。"
            echo
            echo "**② 所有出站被内核拒绝（EPERM）**：firewall_post.ut 在 TUN 模式下把本机"
            echo "mangle_output 也挂上 tun 分流链，给 sing-box 自己发出的包打 mark 绕回"
            echo "singtun0。本版给 mangle_output 加 meta skuid 0 return 豁免本机进程。"
            echo
            echo "**③ ujail 与运行目录**：init.d 原先只按带空格的 JSON 判断 TUN，紧凑 JSON"
            echo "匹配不上；本版在 tun / redirect_tun 下直接跳过 ujail，并由 rc.local 兜底"
            echo "创建 /var/run/homeproxy。同时不再生成 sing-box 1.14 不接受、会让"
            echo "sing-box check FATAL 的 disable_mtu_discovery 字段。"
            echo
            echo "**④ 卸载策略修正（已实机验证，不再是推演）**：HomeProxy TUN 可与软件"
            echo "flow offload 共存，出厂默认 flow_offloading=1 / flow_offloading_hw=0 /"
            echo "proxy_mode=tun、ipv6_support=0、log_level=warn，main_node 仍为 nil 不接管。"
            echo "A/B 实测硬件 NPU 卸载在 PPPoE+WiFi 组合下反而降速约 40%"
            echo "（54-62 vs 91-115 Mbps），故脚本固定 hw 恒关；offload-guard 不再误关卸载。"
            echo
            echo "**⑤ CPU 调频（新发现的隐藏瓶颈）**：cpufreq-dt 的 ondemand 升频延迟 1 秒，"
            echo "突发流量来不及升频，8 并发仅 192 Mbps；新增 init.d 锁 performance 1.2GHz"
            echo "后 412-450 Mbps。默认停用 radius / airoha-pon-debug / 独立 sing-box init.d，"
            echo "IPTV 未启用时停用 iptv / igmpproxy。"
            echo
            echo "**⑥ 升级清单修正**：/etc/homeproxy/ 整目录不再列入 sysupgrade.conf，否则"
            echo "升级会把用户设备上的旧脚本覆盖回新固件；uci-defaults 会幂等清理历史条目。"
            echo
            echo
            echo "### 已内置：MWAN3 多 WAN"
            echo
            echo "\`luci-app-mwan3\` / \`mwan3\` 及完整依赖链已编入，含原本在 LuCI 软件包页显示"
            echo "「不可用」的 \`kmod-nft-compat\` / \`kmod-ip6tables\` / \`kmod-ipt-ipset\` /"
            echo "\`kmod-ipt-conntrack-extra\` / \`kmod-ipt-ipopt\`（随内核编译，不依赖 opkg）。"
            echo "出厂默认不启用（单 WAN 无收益）；配好第二条 WAN 后执行"
            echo "\`/etc/init.d/mwan3 enable && /etc/init.d/mwan3 start\`。"
            echo "注意：上一版核实的 PassWall2 mwan3 豁免规则不适用于本版，HomeProxy /"
            echo "OpenClash / Nikki 均未核实到同等适配，同时启用前请先核对分流。"
            echo
            echo "### 升级后状态"
            echo
            echo "首次启动脚本带幂等保护，升级不会把已启用的 OpenClash / Nikki / HomeProxy 关掉；"
            echo "\`/etc/sysupgrade.conf\` 明确保留了代理配置、MWAN3 配置、运营商参数、SSH 密钥与首次启动标记。"
          } > /tmp/release-notes.md

          TITLE="${TARGET_DEVICE} PonWrt 固件 - $(date -u '+%Y-%m-%d %H:%M UTC')"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file /tmp/release-notes.md
          fi

          mapfile -t FILES < <(find "$DIR" -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'SHA256SUMS*' -o -name '验收报告.txt' \
               -o -name 'ponwrt-commit.txt' -o -name 'feeds-revisions.txt' \
               -o -name 'packages-in-rootfs.txt' -o -name 'dropped-symbols.txt' \) | sort)
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${FILES[@]}" --clobber
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Upload failure summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-summary
          path: out/*/failure-summary.txt
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            out/*/build.log
            out/*/build-fail-tail.log
            out/*/config.full
          if-no-files-found: warn

      # actions/cache 的隐式 post-save 在 job 失败时不会执行，2h+ 的 toolchain / dl
      # 成果会全部丢失。这里显式保存，让下一次重编能命中缓存。
      - name: Save ccache on failure
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-zn515xg-d-an7581-${{ github.run_id }}

      - name: Save dl cache on failure
        if: failure()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: work/ponwrt/dl
          key: dl-ponwrt-an7581-${{ github.run_id }}
